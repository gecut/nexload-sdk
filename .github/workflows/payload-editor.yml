name: Payload editor compatibility

on:
  pull_request:
    paths:
      - "packages/payload-editor/**"
      - "tools/bundler/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/payload-editor.yml"
  push:
    branches: [main]
    paths:
      - "packages/payload-editor/**"
      - "tools/bundler/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/payload-editor.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        payload-version: ["3.68.5", "latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C packages/payload-editor lint
      - run: pnpm -C packages/payload-editor test
      - run: pnpm -C packages/payload-editor build && node packages/payload-editor/test/consumer-smoke.mjs ${{ matrix.payload-version }}
