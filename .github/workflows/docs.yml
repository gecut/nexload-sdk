name: Docs

on:
  pull_request:
    paths:
      - "apps/docs/**"
      - "packages/healthcheck/**"
      - "packages/payload-fields/**"
      - "packages/payload-editor/**"
      - "packages/payload-operations/**"
      - "packages/payload-schema/**"
      - "skills/healthcheck/**"
      - "skills/payload/**"
      - "skills/payload-fields/**"
      - "skills/payload-editor/**"
      - "skills/payload-operations/**"
      - "skills/payload-schema/**"
      - "scripts/generate-docs-llms.mjs"
      - "scripts/validate-docs.mjs"
      - "scripts/validate-docs-links.mjs"
      - "scripts/validate-skills.mjs"
      - ".github/workflows/docs.yml"
      - "README.md"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "packages/healthcheck/**"
      - "packages/payload-fields/**"
      - "packages/payload-editor/**"
      - "packages/payload-operations/**"
      - "packages/payload-schema/**"
      - "skills/healthcheck/**"
      - "skills/payload/**"
      - "skills/payload-fields/**"
      - "skills/payload-editor/**"
      - "skills/payload-operations/**"
      - "skills/payload-schema/**"
      - "scripts/generate-docs-llms.mjs"
      - "scripts/validate-docs.mjs"
      - "scripts/validate-docs-links.mjs"
      - "scripts/validate-skills.mjs"
      - ".github/workflows/docs.yml"
      - "README.md"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the validated artifact to GitHub Pages
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    concurrency:
      group: docs-validate-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify public API catalog
        run: pnpm --filter docs content:api

      - name: Type-check documentation examples
        run: pnpm --filter docs content:examples

      - name: Validate documentation contracts
        run: pnpm --filter docs content:check

      - name: Verify Markdown and LLM outputs
        run: pnpm --filter docs content:llms

      - name: Test documentation tooling
        run: pnpm --filter docs test

      - name: Validate agent skills
        run: pnpm skills:validate

      - name: Build documentation
        run: pnpm --filter docs build

      - name: Validate built accessibility
        run: pnpm --filter docs content:accessibility

      - name: Verify generated files are current
        run: git diff --exit-code -- apps/docs/src/generated apps/docs/public

      - name: Configure GitHub Pages
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/docs/dist

      - name: Upload documentation preview
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && !inputs.deploy)
        uses: actions/upload-artifact@v4
        with:
          name: docs-preview
          path: apps/docs/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
