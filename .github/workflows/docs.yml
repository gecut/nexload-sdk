name: Docs

on:
  pull_request:
    paths:
      - "apps/docs/**"
      - "packages/healthcheck/**"
      - "packages/payload-fields/**"
      - "packages/payload-editor/**"
      - "packages/payload-schema/**"
      - "skills/healthcheck-*/**"
      - "skills/payload-*/**"
      - "scripts/generate-docs-llms.mjs"
      - "scripts/validate-docs.mjs"
      - "scripts/validate-docs-links.mjs"
      - ".github/workflows/docs.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  push:
    branches: [main]
    paths:
      - "apps/docs/**"
      - "packages/healthcheck/**"
      - "packages/payload-fields/**"
      - "packages/payload-editor/**"
      - "packages/payload-schema/**"
      - "skills/healthcheck-*/**"
      - "skills/payload-*/**"
      - "scripts/validate-docs.mjs"
      - "scripts/validate-docs-links.mjs"
      - "scripts/generate-docs-llms.mjs"
      - ".github/workflows/docs.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter docs content:api
      - run: pnpm --filter docs content:examples
      - run: pnpm --filter docs content:check
      - run: pnpm --filter docs content:llms
      - run: pnpm --filter docs test
      - run: pnpm --filter docs build
      - run: pnpm --filter docs content:links
      - run: pnpm --filter docs content:accessibility
      - run: pnpm skills:validate
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: apps/docs/dist
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: docs-preview
          path: apps/docs/dist
          if-no-files-found: error

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: validate
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
